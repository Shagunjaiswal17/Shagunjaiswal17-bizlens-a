<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizLens AI — Autonomous Document Intelligence & Multi-Bill Reconciliation</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            dark: {
              900: '#060911',
              850: '#090e1a',
              800: '#0d1527',
              700: '#14203a',
              600: '#1e2e50',
            },
            cyanGlow: '#00f5d4',
            violetGlow: '#9d4edd',
            neonGreen: '#10b981',
            neonAmber: '#f59e0b',
            neonRed: '#ef4444',
          },
          animation: {
            'laser': 'laserSweep 2.2s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 2.5s infinite',
          },
          keyframes: {
            laserSweep: {
              '0%, 100%': { top: '0%' },
              '50%': { top: '96%' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.6' },
              '50%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Ethers.js v6 for MetaMask Web3 interactions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>

  <style>
    body {
      background-color: #060911;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(13, 21, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel-glow {
      background: rgba(13, 21, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 245, 212, 0.25);
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.08);
    }
    .laser-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00f5d4, #ffffff, #00f5d4, transparent);
      box-shadow: 0 0 15px #00f5d4, 0 0 30px #00f5d4;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090e1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e2e50;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f5d4;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin + "/api";
    const POLYGON_AMOY_CHAIN_ID = "0x13882"; // 80002

    function BizLensApp() {
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, documents, verify
      
      const [analytics, setAnalytics] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [batchSummary, setBatchSummary] = useState(null);
      const [loading, setLoading] = useState(true);

      // Custom User Gemini API Key
      const [customApiKey, setCustomApiKey] = useState(localStorage.getItem("BIZLENS_GEMINI_KEY") || "");
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      // Web3 Wallet State
      const [walletAddress, setWalletAddress] = useState(null);
      const [isAmoyNetwork, setIsAmoyNetwork] = useState(false);

      // Scanning & Upload State
      const [isScanning, setIsScanning] = useState(false);
      const [scanStage, setScanStage] = useState("");
      const [uploadedFilePreview, setUploadedFilePreview] = useState(null);

      // Modals
      const [showPricingModal, setShowPricingModal] = useState(false);
      const [showChatDrawer, setShowChatDrawer] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Verify portal state
      const [verifyHashInput, setVerifyHashInput] = useState("");
      const [verifyResult, setVerifyResult] = useState(null);
      const [isVerifying, setIsVerifying] = useState(false);

      // Chat state
      const [chatMessages, setChatMessages] = useState([
        { role: "assistant", text: "Hello! I am BizLens AI. Ask me anything about your invoices, multi-bill batches, spending categories, or vendor records!" }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [chatLoading, setChatLoading] = useState(false);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4000);
      };

      const saveApiKey = (key) => {
        setCustomApiKey(key);
        localStorage.setItem("BIZLENS_GEMINI_KEY", key);
        setShowApiKeyModal(false);
        triggerToast("Gemini API key saved! Live Gemini 2.5 Flash vision enabled.");
      };

      const fetchData = async () => {
        try {
          const [resAnalytics, resDocs] = await Promise.all([
            fetch(`${API_BASE}/analytics/summary`),
            fetch(`${API_BASE}/documents`)
          ]);
          if (resAnalytics.ok) setAnalytics(await resAnalytics.json());
          if (resDocs.ok) setDocuments(await resDocs.json());
        } catch (err) {
          console.error("Error fetching data:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        checkWalletConnection();
      }, []);

      const checkWalletConnection = async () => {
        if (window.ethereum) {
          try {
            const accounts = await window.ethereum.request({ method: "eth_accounts" });
            if (accounts.length > 0) {
              setWalletAddress(accounts[0]);
              const chainId = await window.ethereum.request({ method: "eth_chainId" });
              setIsAmoyNetwork(chainId === POLYGON_AMOY_CHAIN_ID);
            }
          } catch (e) {
            console.error("MetaMask check error:", e);
          }
        }
      };

      const connectWallet = async () => {
        if (!window.ethereum) {
          alert("MetaMask not found! Please install MetaMask to use Web3 features.");
          return;
        }
        try {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          setWalletAddress(accounts[0]);
          triggerToast(`Connected: ${accounts[0].slice(0, 6)}...${accounts[0].slice(-4)}`);
        } catch (err) {
          triggerToast("Wallet connection cancelled.");
        }
      };

      // Handle Multiple File Upload (Batch or Single)
      const handleFileUpload = async (files) => {
        if (!files || files.length === 0) return;
        setIsScanning(true);

        const isMulti = files.length > 1;

        if (isMulti) {
          setScanStage(`Batch Ingestion: Processing ${files.length} documents concurrently...`);
        } else {
          setScanStage("Computing physical SHA-256 fingerprint & analyzing layout...");
          const reader = new FileReader();
          reader.onload = (e) => setUploadedFilePreview(e.target.result);
          reader.readAsDataURL(files[0]);
        }

        try {
          await new Promise(r => setTimeout(r, 600));

          if (isMulti) {
            setScanStage(`Invoking Gemini 2.5 Flash on ${files.length} bills + cross-invoice duplicate check...`);
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
              formData.append("files", files[i]);
            }
            if (walletAddress) formData.append("wallet_address", walletAddress);
            if (customApiKey) formData.append("gemini_api_key", customApiKey);

            const res = await fetch(`${API_BASE}/documents/batch-scan`, {
              method: "POST",
              body: formData
            });

            if (!res.ok) throw new Error("Batch processing failed");
            const batchData = await res.json();
            setBatchSummary(batchData);
            triggerToast(`Successfully processed batch of ${batchData.total_files_processed} bills!`);
          } else {
            setScanStage("Invoking Gemini 2.5 Flash with response_schema structured outputs...");
            const formData = new FormData();
            formData.append("file", files[0]);
            if (walletAddress) formData.append("wallet_address", walletAddress);
            if (customApiKey) formData.append("gemini_api_key", customApiKey);

            const res = await fetch(`${API_BASE}/documents/scan`, {
              method: "POST",
              body: formData
            });

            if (!res.ok) throw new Error("Document processing failed");
            const newDoc = await res.json();
            setSelectedDoc(newDoc);
            triggerToast(`Extracted ${newDoc.document_type}: ${newDoc.extracted_data.vendor.name}`);
          }

          fetchData();
        } catch (err) {
          triggerToast("Scanning error: " + err.message);
        } finally {
          setIsScanning(false);
          setScanStage("");
        }
      };

      // 1-Click Test Samples
      const testSample = async (type) => {
        let sampleName = "Infosys_Cloud_VPS_Oct2026.pdf";
        if (type === "receipt") sampleName = "Chai_Point_Team_Snacks_Receipt.jpg";
        if (type === "card") sampleName = "Rajesh_Sharma_ApexCloud_VisitingCard.jpg";
        if (type === "fraud") sampleName = "Suspicious_Vendor_Duplicate_TaxTampered.pdf";

        const dummy = `BizLens AI Sample Document: ${sampleName} - ${Date.now()}`;
        const blob = new Blob([dummy], { type: "application/pdf" });
        const file = new File([blob], sampleName, { type: "application/pdf" });
        handleFileUpload([file]);
      };

      // Test 5-Bill Batch Sample in 1-Click
      const testBatchSample = async () => {
        const samples = [
          { name: "AWS_Cloud_Invoice_Batch1.pdf", desc: "AWS Cloud VPS Hosting Oct 2026" },
          { name: "ChaiPoint_TeamSnacks_Receipt.jpg", desc: "Chai Point Catering Bill" },
          { name: "MakeMyTrip_Flight_BLR.pdf", desc: "IndiGo Corporate Air Ticket" },
          { name: "Staples_OfficePaper_Bengaluru.pdf", desc: "A4 Copy Paper Reams Bulk" },
          { name: "AWS_Cloud_Invoice_Batch1.pdf", desc: "AWS Cloud VPS (Intentional Duplicate Bill)" }
        ];

        const files = samples.map((s, idx) => {
          const blob = new Blob([`${s.desc} - Batch Seed ${idx}`], { type: "application/pdf" });
          return new File([blob], s.name, { type: "application/pdf" });
        });

        handleFileUpload(files);
      };

      // Batch Notarize All
      const handleBatchNotarize = async () => {
        if (!batchSummary || !batchSummary.documents) return;
        const ids = batchSummary.documents.map(d => d.id);
        triggerToast("Notarizing complete batch on Polygon Amoy...");
        try {
          const res = await fetch(`${API_BASE}/documents/batch-notarize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ document_ids: ids })
          });
          const data = await res.json();
          triggerToast(`Batch Notarized on Polygon! (${data.notarized_count} documents proof anchored)`);
          fetchData();
          setBatchSummary(null);
        } catch (e) {
          triggerToast("Batch notarize error: " + e.message);
        }
      };

      // Notarize Single Document
      const handleNotarize = async (docId) => {
        try {
          triggerToast("Initiating Polygon Amoy on-chain notarization...");
          const res = await fetch(`${API_BASE}/documents/${docId}/notarize`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({})
          });
          if (res.ok) {
            const data = await res.json();
            triggerToast("Notarized on Polygon Amoy! Proof recorded on-chain.");
            fetchData();
            if (selectedDoc && selectedDoc.id === docId) {
              setSelectedDoc({
                ...selectedDoc,
                on_chain_status: "NOTARIZED",
                blockchain_tx_hash: data.tx_hash,
                polygonscan_url: data.polygonscan_url
              });
            }
          }
        } catch (e) {
          triggerToast("Notarization error: " + e.message);
        }
      };

      // Public Verification
      const handleVerifyQuery = async (hashOrFile) => {
        setIsVerifying(true);
        setVerifyResult(null);
        try {
          let formData = new FormData();
          if (typeof hashOrFile === "string") {
            formData.append("file_sha256", hashOrFile.trim());
          } else {
            formData.append("file", hashOrFile);
          }
          const res = await fetch(`${API_BASE}/verify`, { method: "POST", body: formData });
          setVerifyResult(await res.json());
        } catch (err) {
          triggerToast("Verification failed: " + err.message);
        } finally {
          setIsVerifying(false);
        }
      };

      // Chat Query
      const handleSendMessage = async () => {
        if (!chatInput.trim() || chatLoading) return;
        const userMsg = chatInput.trim();
        setChatInput("");
        setChatMessages(prev => [...prev, { role: "user", text: userMsg }]);
        setChatLoading(true);

        try {
          const res = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userMsg })
          });
          const data = await res.json();
          setChatMessages(prev => [...prev, {
            role: "assistant",
            text: data.answer,
            filter: data.filter_applied,
            citations: data.citations
          }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { role: "assistant", text: "Error processing query." }]);
        } finally {
          setChatLoading(false);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Toast */}
          {toastMsg && (
            <div className="fixed top-5 right-5 z-50 glass-panel border border-cyanGlow/40 text-cyanGlow px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
              <span className="text-xl">✨</span>
              <span className="text-sm font-medium">{toastMsg}</span>
            </div>
          )}

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 glass-panel border-b border-white/10 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-4">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyanGlow to-violetGlow flex items-center justify-center font-black text-dark-900 text-xl shadow-lg shadow-cyanGlow/20">
                B
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="font-extrabold text-lg tracking-tight text-white">BizLens <span className="text-cyanGlow">AI</span></h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">Gemini 2.5 + Web3</span>
                </div>
                <p className="text-xs text-gray-400">Multi-Bill Batch Reconciliation & Proof-of-Document</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-1 glass-panel px-2 py-1.5 rounded-xl border border-white/5">
              <button
                onClick={() => setActiveTab("dashboard")}
                className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'dashboard' ? 'bg-cyan-500/20 text-cyanGlow border border-cyan-500/40' : 'text-gray-400 hover:text-white'}`}
              >
                Dashboard
              </button>
              <button
                onClick={() => setActiveTab("documents")}
                className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'documents' ? 'bg-cyan-500/20 text-cyanGlow border border-cyan-500/40' : 'text-gray-400 hover:text-white'}`}
              >
                Ledger Timeline ({documents.length})
              </button>
              <button
                onClick={() => setActiveTab("verify")}
                className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'verify' ? 'bg-cyan-500/20 text-cyanGlow border border-cyan-500/40' : 'text-gray-400 hover:text-white'}`}
              >
                Verify On-Chain 🛡️
              </button>
            </nav>

            {/* Right Controls: Gemini API Key Setting, Network, MetaMask */}
            <div className="flex items-center space-x-3">
              {/* Custom Gemini Key Setting */}
              <button
                onClick={() => setShowApiKeyModal(true)}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-mono transition border ${
                  customApiKey ? 'bg-emerald-950/80 border-emerald-500/50 text-emerald-300' : 'bg-dark-800 border-white/10 text-gray-400 hover:text-white hover:border-cyanGlow/50'
                }`}
                title="Configure Gemini API Key"
              >
                <span>🔑</span>
                <span className="hidden sm:inline">{customApiKey ? "Gemini Key: Active" : "Set Gemini Key"}</span>
              </button>

              {/* Polygon Amoy Network Badge */}
              <div className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-dark-800 border border-purple-500/30 text-purple-300 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                <span className="hidden sm:inline">Polygon Amoy (80002)</span>
              </div>

              {/* MetaMask Connect */}
              {walletAddress ? (
                <div className="flex items-center space-x-2 px-3 py-1.5 rounded-lg bg-cyan-950/80 border border-cyan-500/40 text-cyanGlow text-xs font-mono">
                  <span className="w-2 h-2 rounded-full bg-cyanGlow"></span>
                  <span>{walletAddress.slice(0, 6)}...{walletAddress.slice(-4)}</span>
                </div>
              ) : (
                <button
                  onClick={connectWallet}
                  className="px-4 py-2 rounded-xl bg-gradient-to-r from-cyanGlow to-cyan-500 text-dark-900 font-bold text-xs shadow-lg shadow-cyanGlow/20 hover:opacity-90 transition flex items-center space-x-2"
                >
                  <span>🦊 Connect MetaMask</span>
                </button>
              )}
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
            {activeTab === "dashboard" && (
              <>
                {/* Hero Stat Cards */}
                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                  <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-cyanGlow">
                    <p className="text-xs text-gray-400 font-medium">Total Spend (INR)</p>
                    <h3 className="text-2xl font-extrabold mt-1 text-white font-mono">
                      ₹{analytics ? analytics.total_spend.toLocaleString('en-IN') : "460,593"}
                    </h3>
                    <p className="text-[11px] text-cyan-400 mt-1">Across all reconciled bills</p>
                  </div>

                  <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-violetGlow">
                    <p className="text-xs text-gray-400 font-medium">Docs Processed</p>
                    <h3 className="text-2xl font-extrabold mt-1 text-white font-mono">
                      {analytics ? analytics.total_documents : "10"}
                    </h3>
                    <p className="text-[11px] text-purple-400 mt-1">Invoices, Receipts, Cards</p>
                  </div>

                  <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-emerald-400">
                    <p className="text-xs text-gray-400 font-medium">Hours Saved</p>
                    <h3 className="text-2xl font-extrabold mt-1 text-white font-mono">
                      {analytics ? analytics.hours_saved : "2.5"} hrs
                    </h3>
                    <p className="text-[11px] text-emerald-400 mt-1">Manual data entry saved</p>
                  </div>

                  <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-amber-400">
                    <p className="text-xs text-gray-400 font-medium">Anomalies Caught</p>
                    <h3 className="text-2xl font-extrabold mt-1 text-white font-mono">
                      {analytics ? analytics.anomalies_caught : "1"}
                    </h3>
                    <p className="text-[11px] text-amber-400 mt-1">Duplicate & spike flags</p>
                  </div>

                  <div className="glass-panel p-5 rounded-2xl border-l-4 border-l-cyan-400 col-span-2 md:col-span-1">
                    <p className="text-xs text-gray-400 font-medium">On-Chain Proofs</p>
                    <h3 className="text-2xl font-extrabold mt-1 text-white font-mono flex items-center space-x-1.5">
                      <span>{analytics ? analytics.documents_notarized : "8"}</span>
                      <span className="text-xs text-cyanGlow">🛡️ Polygon</span>
                    </h3>
                    <p className="text-[11px] text-cyan-400 mt-1">Immutable audit trail</p>
                  </div>
                </div>

                {/* Upload & Scanner Section (Supports Multi-File Batch Selection) */}
                <div className="glass-panel-glow p-8 rounded-3xl relative overflow-hidden">
                  <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="space-y-3 max-w-xl">
                      <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-cyan-950 border border-cyan-800 text-cyan-400 text-xs font-semibold">
                        <span>✨ Multi-Bill Batch Upload & Cross-Bill Reconciliation</span>
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                        Drop 1, 5, or 20 bills at once.
                      </h2>
                      <p className="text-sm text-gray-400">
                        Upload multiple bills simultaneously. BizLens cross-analyzes cumulative spend, checks for duplicate invoices across the batch, verifies GSTIN math, and notarizes on Polygon in 1 click.
                      </p>

                      {/* 1-Click Multi-Bill Test Button */}
                      <div className="pt-2 flex flex-wrap items-center gap-2">
                        <button
                          onClick={testBatchSample}
                          className="px-4 py-2 text-xs rounded-xl bg-gradient-to-r from-cyanGlow to-violetGlow text-dark-900 font-extrabold shadow-lg shadow-cyanGlow/20 hover:scale-105 transition"
                        >
                          ⚡ Test 5-Bill Batch Analysis (1-Click)
                        </button>
                        <button
                          onClick={() => testSample("invoice")}
                          className="px-3 py-1.5 text-xs rounded-lg bg-dark-700 hover:bg-dark-600 text-cyan-300 border border-cyan-500/20"
                        >
                          Single Invoice
                        </button>
                        <button
                          onClick={() => testSample("receipt")}
                          className="px-3 py-1.5 text-xs rounded-lg bg-dark-700 hover:bg-dark-600 text-purple-300 border border-purple-500/20"
                        >
                          Single Receipt
                        </button>
                        <button
                          onClick={() => testSample("fraud")}
                          className="px-3 py-1.5 text-xs rounded-lg bg-red-950/60 hover:bg-red-900/60 text-red-300 border border-red-500/30"
                        >
                          Fraud Anomaly Bill ⚠️
                        </button>
                      </div>
                    </div>

                    {/* Drag and Drop Box with multiple attribute */}
                    <div className="w-full md:w-80">
                      <label className="border-2 border-dashed border-cyan-500/40 hover:border-cyanGlow rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer bg-dark-800/50 hover:bg-dark-800 transition group relative overflow-hidden">
                        <input
                          type="file"
                          multiple
                          accept=".jpg,.jpeg,.png,.webp,.pdf"
                          className="hidden"
                          onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                        />

                          className="px-3 py-1.5 rounded-lg bg-cyan-950 text-cyanGlow text-xs border border-cyan-800 font-mono"
                        >
                          View Polygonscan
                        </a>
                      ) : (
                        <button
                          onClick={() => handleNotarize(selectedDoc.id)}
                          className="px-3 py-1.5 rounded-lg bg-cyanGlow text-dark-900 font-bold text-xs"
                        >
                          Notarize on Polygon ⚡
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Right: Extracted fields */}
                  <div className="p-6 space-y-6 overflow-y-auto bg-dark-850">
                    <div className="flex flex-wrap gap-2">
                      <span className="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-dark-700 text-cyanGlow border border-cyan-500/30">
                        Confidence: {(selectedDoc.overall_confidence * 100).toFixed(0)}%
                      </span>
                      <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-950 text-emerald-400 border border-emerald-800">
                        {selectedDoc.validation_status}
                      </span>
                      <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-cyan-950 text-cyan-400 border border-cyan-800">
                        {selectedDoc.fraud_status}
                      </span>
                    </div>

                    {selectedDoc.fraud_reasons && selectedDoc.fraud_reasons.length > 0 && (
                      <div className="p-3 rounded-xl bg-red-950/40 border border-red-500/40 text-red-300 text-xs space-y-1">
                        <p className="font-bold">⚠️ Anomaly Flags:</p>
                        {selectedDoc.fraud_reasons.map((r, i) => (
                          <p key={i} className="text-[11px]">• {r}</p>
                        ))}
                      </div>
                    )}

                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="p-3 rounded-xl bg-dark-800 border border-white/5">
                        <span className="text-gray-400 text-[10px]">Vendor:</span>
                        <p className="font-bold text-white mt-0.5">{selectedDoc.extracted_data?.vendor?.name || "N/A"}</p>
                      </div>
                      <div className="p-3 rounded-xl bg-dark-800 border border-white/5">
                        <span className="text-gray-400 text-[10px]">GSTIN:</span>
                        <p className="font-mono font-bold text-cyanGlow mt-0.5">{selectedDoc.extracted_data?.vendor?.gstin || "N/A"}</p>
                      </div>
                      <div className="p-3 rounded-xl bg-dark-800 border border-white/5">
                        <span className="text-gray-400 text-[10px]">Document Ref:</span>
                        <p className="font-mono text-white mt-0.5">{selectedDoc.extracted_data?.document_number || "N/A"}</p>
                      </div>
                      <div className="p-3 rounded-xl bg-dark-800 border border-white/5">
                        <span className="text-gray-400 text-[10px]">Due Date:</span>
                        <p className="font-mono text-white mt-0.5">{selectedDoc.extracted_data?.due_date || "Point of Sale"}</p>
                      </div>
                    </div>

                    {selectedDoc.extracted_data?.total_amount > 0 && (
                      <div className="p-4 rounded-xl bg-dark-800 border border-white/10 flex justify-between items-center text-xs font-mono">
                        <div>
                          <p className="text-gray-400">Subtotal: ₹{selectedDoc.extracted_data?.subtotal?.toFixed(2) || "0.00"}</p>
                          <p className="text-gray-400">Tax/GST: ₹{selectedDoc.extracted_data?.tax_amount?.toFixed(2) || "0.00"}</p>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] text-gray-400">GRAND TOTAL</span>
                          <p className="text-xl font-extrabold text-cyanGlow">₹{selectedDoc.extracted_data.total_amount.toLocaleString('en-IN')}</p>
                        </div>
                      </div>
                    )}

                    {selectedDoc.smart_actions?.email_draft && (
                      <div className="p-4 rounded-xl bg-purple-950/40 border border-purple-500/30 space-y-2 text-xs">
                        <p className="text-purple-300 font-bold">Personalized Outreach Email:</p>
                        <textarea readOnly rows="3" value={selectedDoc.smart_actions.email_draft} className="w-full text-xs font-mono p-2 rounded-lg bg-dark-900 border border-white/10 text-gray-300" />
                        <button onClick={() => { navigator.clipboard.writeText(selectedDoc.smart_actions.email_draft); triggerToast("Copied email draft!"); }} className="px-3 py-1 rounded bg-cyanGlow text-dark-900 font-bold text-xs">Copy Email</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* GEMINI API KEY SETTINGS MODAL */}
          {showApiKeyModal && (
            <div className="fixed inset-0 z-50 bg-dark-900/90 backdrop-blur-md flex items-center justify-center p-6">
              <div className="glass-panel w-full max-w-md rounded-3xl border border-cyanGlow/40 p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white flex items-center space-x-2">
                    <span>🔑</span>
                    <span>Set Google Gemini API Key</span>
                  </h3>
                  <button onClick={() => setShowApiKeyModal(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-gray-300">
                  Enter your Google Gemini API key to enable 100% live vision extraction on your exact uploaded documents. (Key is stored safely in your browser).
                </p>
                <input
                  type="password"
                  placeholder="AIzaSy..."
                  value={customApiKey}
                  onChange={(e) => setCustomApiKey(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl bg-dark-850 border border-white/15 text-xs font-mono text-white focus:outline-none focus:border-cyanGlow"
                />
                <div className="flex justify-between items-center pt-2">
                  <a
                    href="https://aistudio.google.com/app/apikey"
                    target="_blank"
                    className="text-[11px] text-cyanGlow hover:underline"
                  >
                    Get a Free Key from Google AI Studio ↗
                  </a>
                  <button
                    onClick={() => saveApiKey(customApiKey)}
                    className="px-4 py-2 rounded-xl bg-cyanGlow text-dark-900 font-bold text-xs"
                  >
                    Save & Enable Live AI
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FLOATING "ASK BIZLENS" CHAT BUTTON & DRAWER */}
          <div className="fixed bottom-6 right-6 z-40">
            {!showChatDrawer ? (
              <button
                onClick={() => setShowChatDrawer(true)}
                className="px-5 py-3 rounded-full bg-gradient-to-r from-cyanGlow to-violetGlow text-dark-900 font-extrabold text-sm shadow-2xl shadow-cyanGlow/30 hover:scale-105 transition flex items-center space-x-2"
              >
                <span>💬 Ask BizLens AI</span>
              </button>
            ) : (
              <div className="glass-panel w-96 rounded-3xl border border-cyanGlow/40 shadow-2xl flex flex-col h-[520px] overflow-hidden animate-slide-up">
                <div className="px-4 py-3 border-b border-white/10 flex items-center justify-between bg-dark-850">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">🤖</span>
                    <div>
                      <h4 className="font-bold text-white text-xs">Ask BizLens AI</h4>
                      <p className="text-[10px] text-cyan-400">Safe Parameterized Search</p>
                    </div>
                  </div>
                  <button onClick={() => setShowChatDrawer(false)} className="text-gray-400 hover:text-white text-xs">✕</button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                  {chatMessages.map((msg, i) => (
                    <div
                      key={i}
                      className={`p-3 rounded-2xl max-w-[85%] ${
                        msg.role === 'user' ? 'ml-auto bg-cyanGlow text-dark-900 font-medium' : 'bg-dark-800 text-gray-200 border border-white/5'
                      }`}
                    >
                      <p>{msg.text}</p>
                    </div>
                  ))}
                  {chatLoading && (
                    <div className="p-3 rounded-2xl bg-dark-800 text-cyanGlow text-xs flex items-center space-x-2">
                      <span className="animate-spin">⚙️</span>
                      <span>Consulting ledger...</span>
                    </div>
                  )}
                </div>

                <div className="p-3 border-t border-white/10 bg-dark-850 flex space-x-2">
                  <input
                    type="text"
                    placeholder="Ask about spending or vendors..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                    className="flex-1 px-3 py-2 rounded-xl bg-dark-800 border border-white/10 text-xs text-white focus:outline-none focus:border-cyanGlow"
                  />
                  <button onClick={handleSendMessage} className="px-3 py-2 rounded-xl bg-cyanGlow text-dark-900 font-bold text-xs">Send</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<BizLensApp />);
  </script>
</body>
</html>
